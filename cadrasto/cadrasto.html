<!DOCTYPE html>
<html lang="br">
<head>

    <title>FORMULARIOS</title>

<body>

        <nav>

    <main>
        <h1>
            FORMULARIOS

    <h1>cadrasto</h1>
    <form action="resultado.html" method="get">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required><br><br>

        <label for="radiolang"> Selecione uma linguagem:</label><br>
        <input type="radio" name="linguagem" id="html" value="html">
        <label for="html">HTML qualquer coisa</label><br>
        <input type="radio" name="linguagem" id="ja" value="js">
        <label for="js">Java Script</label><br>
        <input type="radio" name="linguagem" id="css" value="css">
        <label for="js">CSS 3</label>

        <h3>Selecione uma aula top:</h3>
        <input type="radio" name="aulatop" id="ahtml" value="Aula do Prof TOP">
        <label for="ahtml">Aula de HTML do P1</label><br>
        <input type="radio" name="aulatop" id="ajs" value="Aula de js do P2">
        <label for="ajs">Aula de Java Script do P2</label><br>
        <input type="radio" name="aulatop" id="acss" value="Aula TOP">
        <label for="js">Aula de CSS 3</label>




        <br><br>
        <input type="submit" value="Cadastrar">
    <footer>

    </footer>
